<!DOCTYPE html>
<html lang="en">
<head<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#cc0000">
>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles">
</head>
<body>
  <div class="calculator">
    <!-- Display screen -->
    <input type="text" class="display" readonly>

    <!-- Buttons -->
    <div class="buttons">
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="clear">C</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>+</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>-</button>

      <button>0</button>
      <button>.</button>
      <button class="equal">=</button>
      <button>*</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
